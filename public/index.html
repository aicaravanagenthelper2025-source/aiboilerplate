<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Caravan Guide</title>
  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      margin: 0;
      background: #0b1220;
      color: #e7ecf3;
    }

    .wrap {
      max-width: 860px;
      margin: 40px auto;
      padding: 0 16px;
    }

    .card {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .2);
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 10px;
    }

    p {
      opacity: .9;
    }

    textarea {
      width: 100%;
      min-height: 90px;
      border-radius: 12px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #e7ecf3;
      padding: 12px;
      font-size: 15px;
    }

    button {
      margin-top: 10px;
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .refs {
      margin-top: 10px;
      font-size: 14px;
      opacity: .9;
    }

    .out {
      margin-top: 16px;
      line-height: 1.55;
    }

    /* Ajustes de Markdown */
    #out ul {
      list-style: disc;
      margin-left: 1.25rem;
    }

    #out ol {
      list-style: decimal;
      margin-left: 1.25rem;
    }

    #out h2,
    #out h3 {
      margin: .6rem 0 .3rem;
    }

    #out p {
      margin: .5rem 0;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="password"],
    input[type="text"] {
      flex: 0 0 220px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid #334155;
      background: #0b1220;
      color: #e7ecf3;
      padding: 0 10px;
    }

    small {
      color: #a3b3d3;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>AI Caravan Guide</h1>
      <p>Haz preguntas sobre Vertex AI (agentes, entrenamiento, Search). Respuestas concisas con referencias.</p>
      <textarea id="q" placeholder="Ej.: ¿Cómo creo un agente con herramientas y memoria en Vertex AI?"></textarea>
      <button id="send">Preguntar</button>
      <div id="out" class="out"></div>
      <div id="refs" class="refs"></div>
    </div>
  </div>

  <!-- Librerías para Markdown y sanitizado -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

  <!-- Script principal -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const ENDPOINT = "/ask"; // rewrite de firebase.json
      const qEl = document.querySelector("#q");
      const outEl = document.querySelector("#out");
      const refsEl = document.querySelector("#refs");
      const btn = document.querySelector("#send");

      function stripReferencesSection(s) {
        return (s || "").replace(/\n?\s*(\*\*?\s*Referencias?\s*\*\*?:?|\#+\s*Referencias?)\s*[\s\S]*$/i, "");
      }

      function dedupeRefs(refs) {
        const m = new Map();
        (refs || []).forEach(r => {
          const key = (r.url || r.title || "").trim().toLowerCase();
          if (!key) return;
          if (!m.has(key)) m.set(key, r);
        });
        return [...m.values()];
      }

      async function ask() {
        const q = qEl.value.trim();
        if (!q) return;
        btn.disabled = true;
        outEl.textContent = "Pensando…";
        refsEl.innerHTML = "";

        try {
          const resp = await fetch(ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: q })
          });

          const json = await resp.json();
          if (!resp.ok) throw new Error(json.error || "Error");

          // Render Markdown seguro
          const cleaned = stripReferencesSection(json.text || "");
          const html = DOMPurify.sanitize(marked.parse(cleaned));
          outEl.innerHTML = html;

          // Mostrar referencias únicas
          const uniq = dedupeRefs(json.references || []);
          if (uniq.length) {
            const items = uniq.map(r =>
              r.url
                ? `<li><a href="${r.url}" target="_blank" rel="noopener">${r.title || r.url}</a></li>`
                : `<li>${r.title || "Referencia"}</li>`
            ).join("");
            refsEl.innerHTML = `<strong>Referencias</strong><ul>${items}</ul>`;
          }
        } catch (e) {
          outEl.textContent = "Error: " + (e.message || e);
        } finally {
          btn.disabled = false;
        }
      }

      btn.addEventListener("click", ask);
    });
  </script>
</body>
</html>
